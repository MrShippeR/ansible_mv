---
- name: Docker
  vars:
    role_docker_path_main_file: "/home/shipper/Dokumenty/ansible_mv/galaxy_roles/geerlingguy.docker/tasks/main.yml"
    docker_edition: 'ce'
    docker_packages:
      - "docker-{{ docker_edition }}"
      - "docker-{{ docker_edition }}-cli"
    docker_daemon_options:
      firewall-backend: "nftables"
      log-driver: "local"
      log-opts:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    docker_users:
      - "{{ ansible_user }}"

  block:

    - name: Add Zorin OS support to geerlingguy.docker role definition
      ansible.builtin.lineinfile:
        path: "{{ role_docker_path_main_file }}"
        insertafter: "- include_tasks: setup-Debian.yml"
        line: "  when: ansible_facts.os_family == 'Zorin OS'"
      delegate_to: localhost
      become: false

    - name: Add IPv4 forwarding for Docker in sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-docker-forwarding.conf
        content: |
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: '0644'

    - name: Disable IPv6 in sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-disable-ipv6.conf
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
        owner: root
        group: root
        mode: '0644'

    - name: Apply changes by restarting sysctl.conf
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker
   
    - name: Disable Docker socket and service for server hosts
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
      loop:
        - docker.socket
        - docker.service
      when: >
        inventory_hostname in ['homelab', 'optiplex', 'backup']
        or group_names | intersect(['homelab', 'optiplex', 'backup']) | length > 0

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "If docker won't start via systemctl, run in manually by sudo dockerd"
          - "======================================================"     