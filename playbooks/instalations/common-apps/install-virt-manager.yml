---
- name: Virtual Machine manager
  vars:
    directory_path: "/home/{{ ansible_user }}/KVM"
    
  block:

    - name: Create KVM directory in /media
      ansible.builtin.file:
        path: /media/kvm
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create link to KVM directory in HOME
      ansible.builtin.file:
        src: "/media/kvm"
        dest: "/home/{{ ansible_user }}/kvm"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        state: link

    - name: Install virt-manager package
      ansible.builtin.apt:
        name: virt-manager
        update_cache: true
        state: present

    - name: Change libvirt firewall service to nftables
      ansible.builtin.lineinfile:
        path: "/etc/libvirt/network.conf"
        regexp: '^\s*#?\s*firewall_backend\s*='
        line: 'firewall_backend = "nftables"'

    - name: Disable IPv6 for interface virbr0 in sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-libvirt-disable-virbr0-ipv6.conf
        content: |
          net.ipv6.conf.virbr0.disable_ipv6=1
          net.ipv6.conf.virbr0.accept_ra=0
          net.ipv6.conf.virbr0.autoconf=0
        owner: root
        group: root
        mode: '0644'

    - name: Apply changes by restarting sysctl.conf
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Add user to libvirt group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: libvirt
        append: yes

    - name: Post install info
      ansible.builtin.debug:
        msg: "To change assigned IPs in virbr0 (IP range, static IP) run command: virsh net-edit default"