---
- name: Sync git my-bash-scripts
  block:

    - name: Install wakeonlan package
      ansible.builtin.apt:
        name: wakeonlan
        update_cache: true
        state: present

    - name: Create directory ~/opt/bin for custom scripts
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/opt/bin"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Clone or update my-bash-scripts repository
      become_user: "{{ ansible_user }}"
      ansible.builtin.git:
        repo: "git@github.com:MrShippeR/my-bash-scripts.git"
        dest: "/home/{{ ansible_user }}/opt/bin"
        update: true
        accept_hostkey: true
      environment:
        SSH_AUTH_SOCK: "{{ lookup('env', 'SSH_AUTH_SOCK') }}"

    - name: Generate Wake-on-LAN clients configuration
      ansible.builtin.template:
        src: wol-clients.cfg.j2
        dest: "/home/{{ ansible_user }}/opt/bin/wol-clients.cfg"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      delegate_to: localhost

    - name: Create a symbolic link in the Documents folder
      ansible.builtin.file:
        src: "/home/{{ ansible_user }}/opt/bin"
        dest: "/home/{{ ansible_user }}/Dokumenty/my-bash-scripts"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        state: link

    - name: Make files executable
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/opt/bin"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
        recurse: yes
    
    - name: Reminder messsage
      ansible.builtin.debug:
        msg: "To be able to system call mywol, playbook set_bash.yml must be executed too."
    
    
    
    
    
    