---
- name: Arduino IDE
  vars:
    arduino_path: "/home/{{ ansible_user }}/Arduino"
    appimage_name: "Arduino-IDE.AppImage"
    script_path: "/tmp/arduino-udev-setup.sh"

  block:
   
    - name: Install dependency libfuse2t64
      ansible.builtin.apt:
        name: libfuse2t64
        state: present
        update_cache: false
      
    - name: Create Arduino directory in HOME
      ansible.builtin.file:
        path: "{{ arduino_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Download Arduino AppImage
      community.general.appimage:
        name: "{{ appimage_name }}"
        install_dir: "{{ arduino_path }}"
        url: https://downloads.arduino.cc/arduino-ide/arduino-ide_latest_Linux_64bit.AppImage
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        state: "present"

    - name: Download icon SVG file
      get_url:
        url: https://www.arduino.cc/wiki/static/arduino-app-76bd27c4ce7246825aceb8efe2871f7a.svg
        dest: "{{ arduino_path }}/icon-arduino-ide.svg"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0444"

    - name: Create .desktop entry from template
      ansible.builtin.template:
        src: "arduino-ide.desktop.j2"
        dest: "/home/{{ ansible_user }}/.local/share/applications/arduino-ide.desktop"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"
        
    - name: Add user to dialout group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: dialout
        append: true

    - name: Add user to tty group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: tty
        append: true

    - name: Add user to plugdev group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: plugdev
        append: true

    - name: Check if Arduino udev rule already exists
      ansible.builtin.stat:
        path: /etc/udev/rules.d/60-arduino-combined.rules
      register: arduino_udev_file
        
    - name: Download arduino-udev-setup.sh
      get_url: 
        url: https://content.arduino.cc/assets/arduino-udev-setup.sh
        dest: "{{ script_path }}"
        mode: '0664'
      when: not arduino_udev_file.stat.exists

    - name: Execute udev shell script to set permissions for various boards
      ansible.builtin.shell:
        cmd: "bash {{ script_path }}"
      when: not arduino_udev_file.stat.exists

    - name: Remove script from TMP
      file: 
        path: "{{ script_path }}"
        state: absent
      when: not arduino_udev_file.stat.exists
        
    - name: Final info
      ansible.builtin.debug:
        msg:
        - "Reboot must be done before user can reach USB port and before icon show in menu."
        - "Because of AppArmor bug AppImage must be run with:"
        - "{{ arduino_path }}/{{ appimage_name }} --no-sandbox"
        - ""
        - "(not need if you run thru .desktop entry):"
        
        
        
        