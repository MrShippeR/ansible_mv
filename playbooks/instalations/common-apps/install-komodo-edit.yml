---
- name: Komodo Edit
  vars:
    komodo_download_url: "https://downloads.activestate.com/Komodo/releases/12.0.1/Komodo-Edit-12.0.1-18441-linux-x86_64.tar.gz"
    tmp_path: "/tmp/komodo-edit"
    tmp_file_name: "komodo-edit.tar.gz"

  block:
   
    - name: Create install directory in TMP
      ansible.builtin.file:
        path: "{{ tmp_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Download {{ tmp_file_name }} to TMP
      get_url:
        url: "{{ komodo_download_url }}"
        dest: "{{ tmp_path }}/{{ tmp_file_name }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0664"
        
    - name: Extract archive
      ansible.builtin.unarchive:
        src: "{{ tmp_path }}/{{ tmp_file_name }}"
        dest: "{{ tmp_path }}"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        
    - name: Find extracted directory
      ansible.builtin.find:
        paths: "{{ tmp_path }}"
        file_type: directory
        recurse: no
      register: extracted_dir

    - name: Set extracted directory path
      ansible.builtin.set_fact:
        komodo_extracted_path: "{{ extracted_dir.files[0].path }}"
        
    - name: Install Komodo
      ansible.builtin.shell:
        cmd: "{{ komodo_extracted_path }}/install.sh --install-dir /home/{{ ansible_user }}/Komodo-Edit-12"
      become_user: "{{ ansible_user }}"
      register: komodo_install
      changed_when: komodo_install.rc == 0

    - name: Display installation output
      ansible.builtin.debug:
        var: komodo_install.stdout_lines
        
    - name: Remove TMP directory
      ansible.builtin.file:
        path: "{{ tmp_path }}"
        state: absent
      when: komodo_install.stderr_lines | length == 0
        
        
        
        
        
        
        
        
        
        
        
        
        
        