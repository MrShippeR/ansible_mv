---
- name: GitHub installation and configuration for user MrShippeR
  block:

    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: false

    - name: Configure Git user name
      become_user: "{{ ansible_user }}"
      community.general.git_config:
        name: user.name
        scope: global
        value: "Marek Vach"

    - name: Configure Git user email
      become_user: "{{ ansible_user }}"
      community.general.git_config:
        name: user.email
        scope: global
        value: "marek@vach.cz"

    - name: Clone test repository
      become_user: "{{ ansible_user }}"
      ansible.builtin.git:
        repo: "git@github.com:MrShippeR/my-bash-scripts.git"
        dest: "/home/{{ ansible_user }}/Stažené/test_repo"
        version: main
        key_file: "/home/{{ ansible_user }}/.ssh/optiplex"
        accept_hostkey: true