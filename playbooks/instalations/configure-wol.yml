
---
- name: Configure Wake-on-LAN for main Ethernet interface
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Install ethtool
      ansible.builtin.apt:
        name: ethtool
        state: present
        update_cache: true

    - name: Validate main Ethernet interface variable
      ansible.builtin.assert:
        that:
          - ethernet_main_interface is defined
          - ethernet_main_interface | length > 0
        fail_msg: "Variable ethernet_main_interface is not defined or empty for this host."

    # ================================================================
    # CHECK FOR NETWORK MANAGER
    # ================================================================

    - name: Check that NetworkManager is installed and available
      ansible.builtin.command:
        cmd: nmcli --version
      register: nmcli_version
      changed_when: false
      failed_when: false

    - name: Stop if NetworkManager is not available
      ansible.builtin.fail:
        msg: >-
          nmcli was not found or NetworkManager is not available.
          This playbook requires NetworkManager.
      when: nmcli_version.rc != 0

    # ================================================================
    # GET CONNECTION PROFILE
    # ================================================================

    - name: Get active NetworkManager connection profile
      ansible.builtin.command:
        cmd: "nmcli -g GENERAL.CONNECTION device show {{ ethernet_main_interface }}"
      register: active_connection_profile
      changed_when: false

    - name: Validate connection profile
      ansible.builtin.assert:
        that:
          - active_connection_profile.stdout | trim | length > 0
          - active_connection_profile.stdout | trim != "--"
        fail_msg: >-
          Could not determine the active NetworkManager connection profile
          for interface {{ ethernet_main_interface }}.

    # ================================================================
    # DISPLAY SUMMARY BEFORE CHANGES FOR APPROVAL
    # ================================================================

    - name: Get current Wake-on-LAN state
      ansible.builtin.shell:
        cmd: "ethtool {{ ethernet_main_interface }} | grep -i wake-on"
      register: current_wol_state
      changed_when: false
      failed_when: false

    - name: Display Ethernet connection
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "BEFORE WAKE-ON-LAN CONFIGURATION"
          - "======================================================"
          - ""
          - "Operating system:"
          - "  {{ ansible_facts.distribution }}"
          - ""
          - "NetworkManager:"
          - "  {{ nmcli_version.stdout | trim }}"
          - ""
          - "Ethernet connection:"
          - "  Interface: {{ ethernet_main_interface }}"
          - "  Connection: {{ active_connection_profile.stdout | trim }}"
          - "  Current: {{ current_wol_state.stdout | trim | default('(no Wake-on-LAN information)', true) }}"
          - ""
          - "d = disabled, g = enabled"
          - ""

    - name: Confirm Wake-on-LAN configuration
      ansible.builtin.pause:
        prompt: |
          Type 'yes' to enable Wake-on-LAN on {{ ethernet_main_interface }}.
          Type anything else to cancel.
      register: user_approval_continue

    - name: Stop if Wake-on-LAN configuration was not confirmed
      ansible.builtin.fail:
        msg: "Wake-on-LAN configuration cancelled by user."
      when: user_approval_continue.user_input | lower != "yes"

    # ================================================================
    # ENABLE WAKE-ON-LAN
    # ================================================================

    - name: Enable Wake-on-LAN magic packets
      ansible.builtin.command:
        cmd: >-
          nmcli connection modify
          "{{ active_connection_profile.stdout | trim }}"
          802-3-ethernet.wake-on-lan magic
      changed_when: true

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Reboot is required before changes take effect."
          - "Reboot the targeted machine and re-run this playbook"
          - "to verify that changes took effect."
          - "======================================================"
