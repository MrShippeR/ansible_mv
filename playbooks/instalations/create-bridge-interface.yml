---
- name: Automatically modify network interface to be able run KVM virtualization accessible on LAN network. Create bridge interface and get enp* interface run thru it.
  hosts: all
  become: true
  gather_facts: true

  vars:
    bridge_name: br0

    # Leave empty for automatic detection.
    # If more than one suitable interface is detected based on pattern enp*,
    # set this variable manually.
    #
    # Example:
    # ethernet_interface_manual: enp0s31f6
    ethernet_interface_manual: ""

    path_to_shell_script: /usr/local/sbin/ansible-create-bridge.sh
    systemd_unit_name: ansible-create-bridge

  tasks:

    # ================================================================
    # CHECK FOR NETWORK MANAGER
    # ================================================================

    - name: Check that NetworkManager is installed
      ansible.builtin.command:
        cmd: nmcli --version
      register: nmcli_version
      changed_when: false
      failed_when: false

    - name: Stop if NetworkManager is not installed
      ansible.builtin.fail:
        msg: >-
          nmcli was not found.

          NetworkManager must be installed before running
          this playbook.
      when: nmcli_version.rc != 0

    # ================================================================
    # DETECT NETWORK INTERFACE
    # ================================================================

    - name: Get NetworkManager devices
      ansible.builtin.command:
        cmd: nmcli -t -f DEVICE,TYPE,STATE device status
      register: nmcli_devices
      changed_when: false

    - name: Find active enp* Ethernet interfaces
      ansible.builtin.set_fact:
        detected_active_ethernet_interfaces: >-
          {{
            nmcli_devices.stdout_lines
            | map('split', ':')
            | selectattr('1', 'equalto', 'ethernet')
            | selectattr('2', 'equalto', 'connected')
            | selectattr('0', 'match', '^enp')
            | map('first')
            | list
          }}

    - name: Stop if no suitable interface was detected
      ansible.builtin.fail:
        msg: >-
          No active Ethernet interface starting with 'enp'
          was detected. Are you using WiFi?

          Set 'ethernet_interface_manual' manually if necessary.
      when:
        - ethernet_interface_manual | length == 0
        - detected_active_ethernet_interfaces | length == 0

    - name: Stop if multiple suitable interfaces were detected
      ansible.builtin.fail:
        msg: >-
          Multiple active Ethernet interfaces starting with 'enp'
          were detected. Set manually which one should be used.

          {{ detected_active_ethernet_interfaces | join(', ') }}

          Set 'ethernet_interface_manual' manually if necessary.
      when:
        - ethernet_interface_manual | length == 0
        - detected_active_ethernet_interfaces | length > 1

    - name: Parsing detected ethernet intergace ID to variable
      ansible.builtin.set_fact:
        ethernet_interface_name: >-
          {{
            ethernet_interface_manual
            if ethernet_interface_manual | length > 0
            else detected_active_ethernet_interfaces[0]
          }}

    # ================================================================
    # GET Ethernet INTERFACE MAC ADDRESS
    # ================================================================

    - name: Get MAC address of ethernet interface
      ansible.builtin.command:
        cmd: cat /sys/class/net/{{ ethernet_interface_name }}/address
      register: ethernet_interface_mac
      changed_when: false

    - name: Parse MAC address to variable
      ansible.builtin.set_fact:
        mac_address: "{{ ethernet_interface_mac.stdout | trim }}"

    - name: Verify MAC address with regex
      ansible.builtin.assert:
        that:
          - mac_address is match('^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$')
        fail_msg: >-
          Could not determine a valid MAC address for
          {{ ethernet_interface_name }}.

          Detected value:
          {{ mac_address }}

    # ================================================================
    # CHECK EXISTING BRIDGE
    # ================================================================

    - name: Check whether bridge {{ bridge_name }} already exists to avoid conflicts
      ansible.builtin.command:
        cmd: nmcli -t -f DEVICE,TYPE device status
      register: nmcli_existing_devices
      changed_when: false

    - name: Stop if bridge {{ bridge_name }} already exists
      ansible.builtin.fail:
        msg: >-
          Network bridge '{{ bridge_name }}' already exists.
      when: >
        nmcli_existing_devices.stdout_lines
        | select('match', '^' ~ bridge_name ~ ':')
        | list
        | length > 0

    # ================================================================
    # IDENTIFY CURRENT CONNECTION PROFILE
    # ================================================================

    - name: Get active connection profile
      ansible.builtin.command:
        cmd: >-
          nmcli -g GENERAL.CONNECTION device show
          {{ ethernet_interface_name }}
      register: active_connection
      changed_when: false

    - name: Validate active connection profile
      ansible.builtin.assert:
        that:
          - active_connection.stdout | trim | length > 0
          - active_connection.stdout | trim != "--"
        fail_msg: >-
          Could not determine the active NetworkManager
          connection profile for {{ ethernet_interface_name }}.

    - name: Store active connection profile
      ansible.builtin.set_fact:
        ethernet_interface_description: "{{ active_connection.stdout | trim }}"

    # ================================================================
    # VERIFY DHCP AND AUTOMATIC DNS
    # ================================================================

    - name: Get current IPv4 method
      ansible.builtin.command:
        cmd: nmcli -g ipv4.method connection show "{{ ethernet_interface_description }}"
      register: current_ipv4_method
      changed_when: false

    - name: Verify IPv4 uses DHCP
      ansible.builtin.assert:
        that:
          - current_ipv4_method.stdout | trim == "auto"
        fail_msg: >-
          IPv4 on connection '{{ ethernet_interface_description }}' is not configured
          for DHCP.

          Current IPv4 method:
          {{ current_ipv4_method.stdout | trim }}

          This playbook only supports IPv4 DHCP configuration.
          No changes have been made.

    - name: Get current IPv4 DNS mode
      ansible.builtin.command:
        cmd: nmcli -g ipv4.ignore-auto-dns connection show "{{ ethernet_interface_description }}"
      register: current_ipv4_ignore_auto_dns
      changed_when: false

    - name: Verify IPv4 DNS is automatic
      ansible.builtin.assert:
        that:
          - current_ipv4_ignore_auto_dns.stdout | trim == "no"
        fail_msg: >-
          IPv4 DNS on connection '{{ ethernet_interface_description }}' is not
          configured for automatic DNS obtained from DHCP.

          This playbook requires automatic DNS configuration.
          No changes have been made.

    # ================================================================
    # DISPLAY PLAN
    # ================================================================

    - name: Get current active IPv4 configuration
      ansible.builtin.command:
        cmd: >-
          nmcli -g IP4.ADDRESS,IP4.GATEWAY,IP4.DNS
          device show {{ ethernet_interface_name }}
      register: current_active_ipv4
      changed_when: false

    - name: Display planned network migration
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "KVM BRIDGE CONFIGURATION"
          - "======================================================"
          - ""
          - "Operating system:"
          - "  {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - ""
          - "Ethernet interface:"
          - "  {{ ethernet_interface_name }}"
          - ""
          - "MAC adress for migration:"
          - "  {{ mac_address }}"
          - ""
          - "Current NetworkManager profile:"
          - "  {{ ethernet_interface_description }}"
          - ""
          - "Current active IPv4 configuration:"
          - "{{ current_active_ipv4.stdout_lines | map('regex_replace', '^', '  ') | list }}"
          - ""
          - "Planned configuration:"
          - "  {{ bridge_name }}"
          - "    ├── MAC: {{ mac_address }}"
          - "    ├── IPv4: DHCP"
          - "    ├── IPv6: auto"
          - "    └── {{ ethernet_interface_name }}"
          - ""
          - "The host's DHCP and DNS configuration will move"
          - "from {{ ethernet_interface_name }} to {{ bridge_name }}."

    # ================================================================
    # USER CONFIRMATION
    # ================================================================

    - name: Confirm network migration
      ansible.builtin.pause:
        prompt: |
          Type 'yes' to continue or anything else to cancel
      register: user_approval_continue

    - name: Stop if network migration was not confirmed
      ansible.builtin.fail:
        msg: "Network bridge creation cancelled by user."
      when:
        - user_approval_continue.user_input | lower != "yes"

    # ================================================================
    # CREATE MIGRATION BASH SCRIPT
    # ================================================================

    - name: Build and send network migration script to targeted machine
      ansible.builtin.template:
        src: "create-bridge-interface.sh.j2"
        dest: "{{ path_to_shell_script }}"
        owner: root
        group: root
        mode: "0750"


    # ================================================================
    # START MIGRATION SCRIPT INDEPENDENTLY OF SSH
    # ================================================================

    - name: Starting migration script on remote machine using systemd
      ansible.builtin.command:
        cmd: >-
          systemd-run
          --unit={{ systemd_unit_name }}
          --collect
          --property=Type=oneshot
          {{ path_to_shell_script }}
      register: bridge_systemd_start
      changed_when: true

    - name: Display migration start information
      ansible.builtin.debug:
        msg:
          - "Systemd unit: {{ systemd_unit_name }}"
          - "Log file: /var/log/ansible-create-bridge.log"
          - ""
          - "The SSH connection may now be interrupted while NetworkManager"
          - "moves the IP configuration from {{ ethernet_interface_name }} to {{ bridge_name }}."
          - ""
          - "We are waiting for targeted machine become online. Max waiting time is 120s..."

    # ================================================================
    # WAIT FOR HOST TO BECOME AVAILABLE AGAIN
    # ================================================================

    - name: Wait for SSH connection to return
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120
        sleep: 5
      delegate_to: "{{ inventory_hostname }}"

    # ================================================================
    # WAIT FOR MIGRATION UNIT TO FINISH
    # ================================================================

    - name: Waiting for migration systemd unit to finish it's work
      ansible.builtin.command:
        cmd: systemctl is-active "{{ systemd_unit_name }}"
      register: systemd_unit_migration_state
      until:
        - systemd_unit_migration_state.stdout | trim in ['inactive', 'failed']
      retries: 30
      delay: 2
      failed_when: false
      changed_when: false

    - name: Get migration systemd unit result
      ansible.builtin.command:
        cmd: systemctl show "{{ systemd_unit_name }}" --property=Result --value
      register: systemd_unit_migration_result
      changed_when: false
      failed_when: false

    - name: Stop if migration failed
      ansible.builtin.fail:
        msg: >-
          Migration systemd unit failed by it's state.
          {{ systemd_unit_migration_result.stdout | trim }}

          You can check unit status by typing:
          systemctl status {{ systemd_unit_name }}

          and view detailed log witch:
          nano /var/log/ansible-create-bridge.log
      when:
        - systemd_unit_migration_result.stdout | trim != "success"

    # ================================================================
    # VERIFY RESULT
    # ================================================================

    - name: Get bridge connection state
      ansible.builtin.command:
        cmd: nmcli -g GENERAL.STATE connection show "{{ bridge_name }}"
      register: final_bridge_state
      changed_when: false

    - name: Get bridge IP address
      ansible.builtin.command:
        cmd: ip -4 -o addr show dev "{{ bridge_name }}"
      register: final_bridge_ip
      changed_when: false

    - name: Get ethernet interface IP address
      ansible.builtin.command:
        cmd: ip -4 -o addr show dev "{{ ethernet_interface_name }}"
      register: final_interface_ip
      changed_when: false

    - name: Get default route
      ansible.builtin.command:
        cmd: ip -4 route show default
      register: final_default_route
      changed_when: false

    - name: Verify bridge has IPv4 address
      ansible.builtin.assert:
        that:
          - final_bridge_ip.stdout | trim | length > 0
        fail_msg: >-
          Bridge {{ bridge_name }} does not have an IPv4 address.
          Check /var/log/ansible-create-bridge.log.
        success_msg: >-
          Bridge {{ bridge_name }} has an IPv4 address.

    - name: Verify ethernet interface has no IPv4 address
      ansible.builtin.assert:
        that:
          - final_interface_ip.stdout | trim | length == 0
        fail_msg: >-
          Ethernet interface {{ ethernet_interface_name }} still has an IPv4 address.
          Expected topology is IP -> {{ bridge_name }} -> {{ ethernet_interface_name }}.
        success_msg: >-
          Ethernet interface {{ ethernet_interface_name }} has no IPv4 address.

    - name: Verify default route exists
      ansible.builtin.assert:
        that:
          - final_default_route.stdout | trim | length > 0
        fail_msg: >-
          No IPv4 default route was found after bridge migration.
        success_msg: >-
          IPv4 default route is present.

    - name: Show final bridge configuration
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "FINAL KVM BRIDGE CONFIGURATION"
          - "======================================================"
          - ""
          - "Bridge name:"
          - "  {{ bridge_name }}"
          - ""
          - "Bridge state:"
          - "  {{ final_bridge_state.stdout | trim }}"
          - ""
          - "Bridge IPv4:"
          - "  {{ final_bridge_ip.stdout | trim }}"
          - ""
          - "Ethernet interface name:"
          - "  {{ ethernet_interface_name }}"
          - ""
          - "Ethernet NetworkManager description:"
          - "  {{ ethernet_interface_description }}"
          - ""
          - "Ethernet interface IPv4:"
          - "  {{ final_interface_ip.stdout | trim | default('(none)', true) }}"
          - ""
          - "Default route:"
          - "  {{ final_default_route.stdout | trim }}"
          - ""
          - "======================================================"
          - "Playbook is complete. If you want to revert changes, manually use commands"
          - "from bash function restore_old_connection in template file create-bridge-interface.sh.j2"