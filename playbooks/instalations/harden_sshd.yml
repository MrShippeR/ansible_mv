---
- name: Harden openssh-server settings
  hosts: all
  become: true
  vars:
    ssh_service_name: "sshd"
  tasks:
    - name: Set LoginGraceTime to 1m
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?LoginGraceTime'
        line: 'LoginGraceTime 1m'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Set root login only to key file authorization
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Set max auth tries to 3
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 3'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd
      
    - name: Allow PubkeyAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Allow PasswordAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Disable PAM authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?UsePAM'
        line: 'UsePAM no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Disable X11 forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: "{{ ssh_service_name }}"
        state: restarted