---
- name: Create network bridge interface and get enp* interface run thru it.
  hosts: all
  become: true
  gather_facts: true

  vars:
    bridge_name: br0

    # Leave empty for automatic detection.
    # If more than one suitable interface is detected,
    # set this variable manually.
    #
    # Example:
    # bridge_interface_manual: enp0s31f6
    bridge_interface_manual: ""

    bridge_script: /usr/local/sbin/ansible-create-bridge.sh
    bridge_unit: ansible-create-bridge

  tasks:

    # ================================================================
    # CHECK FOR NETWORK MANAGER
    # ================================================================

    - name: Check that nmcli is installed
      ansible.builtin.command:
        cmd: nmcli --version
      register: nmcli_version
      changed_when: false
      failed_when: false

    - name: Stop if nmcli is not installed
      ansible.builtin.fail:
        msg: >-
          nmcli was not found.

          NetworkManager must be installed before running
          this playbook.
      when: nmcli_version.rc != 0

    # ================================================================
    # DETECT NETWORK INTERFACE
    # ================================================================

    - name: Get NetworkManager devices
      ansible.builtin.command:
        cmd: nmcli -t -f DEVICE,TYPE,STATE device status
      register: nmcli_devices
      changed_when: false

    - name: Find active enp Ethernet interfaces
      ansible.builtin.set_fact:
        detected_bridge_interfaces: >-
          {{
            nmcli_devices.stdout_lines
            | map('split', ':')
            | selectattr('1', 'equalto', 'ethernet')
            | selectattr('2', 'equalto', 'connected')
            | selectattr('0', 'match', '^enp')
            | map('first')
            | list
          }}

    - name: Stop if no suitable interface was detected
      ansible.builtin.fail:
        msg: >-
          No active Ethernet interface starting with 'enp'
          was detected.

          NetworkManager devices:
          {{ nmcli_devices.stdout_lines | join(', ') }}

          Set 'bridge_interface_manual' manually if necessary.
      when:
        - bridge_interface_manual | length == 0
        - detected_bridge_interfaces | length == 0

    - name: Stop if multiple suitable interfaces were detected
      ansible.builtin.fail:
        msg: >-
          Multiple active Ethernet interfaces starting with 'enp'
          were detected:

          {{ detected_bridge_interfaces | join(', ') }}

          Set 'bridge_interface_manual' manually if necessary.
      when:
        - bridge_interface_manual | length == 0
        - detected_bridge_interfaces | length > 1

    - name: Select physical network interface
      ansible.builtin.set_fact:
        bridge_interface: >-
          {{
            bridge_interface_manual
            if bridge_interface_manual | length > 0
            else detected_bridge_interfaces[0]
          }}

    # ================================================================
    # GET PHYSICAL INTERFACE MAC ADDRESS
    # ================================================================

    - name: Get MAC address of physical interface
      ansible.builtin.command:
        cmd: cat /sys/class/net/{{ bridge_interface }}/address
      register: bridge_interface_mac
      changed_when: false

    - name: Store physical interface MAC address
      ansible.builtin.set_fact:
        bridge_mac_address: "{{ bridge_interface_mac.stdout | trim }}"

    - name: Verify physical interface MAC address
      ansible.builtin.assert:
        that:
          - bridge_mac_address is match('^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$')
        fail_msg: >-
          Could not determine a valid MAC address for
          {{ bridge_interface }}.

          Detected value:
          {{ bridge_mac_address }}

    # ================================================================
    # CHECK EXISTING BRIDGE
    # ================================================================

    - name: Check whether {{ bridge_name }} already exists
      ansible.builtin.command:
        cmd: nmcli -t -f DEVICE,TYPE device status
      register: nmcli_existing_devices
      changed_when: false

    - name: Stop if bridge already exists
      ansible.builtin.fail:
        msg: >-
          Network bridge '{{ bridge_name }}' already exists.
      when: >
        nmcli_existing_devices.stdout_lines
        | select('match', '^' ~ bridge_name ~ ':')
        | list
        | length > 0

    # ================================================================
    # IDENTIFY CURRENT CONNECTION PROFILE
    # ================================================================

    - name: Get active connection profile
      ansible.builtin.command:
        cmd: >-
          nmcli -g GENERAL.CONNECTION device show
          {{ bridge_interface }}
      register: active_connection
      changed_when: false

    - name: Validate active connection profile
      ansible.builtin.assert:
        that:
          - active_connection.stdout | trim | length > 0
          - active_connection.stdout | trim != "--"
        fail_msg: >-
          Could not determine the active NetworkManager
          connection profile for {{ bridge_interface }}.

    - name: Store active connection profile
      ansible.builtin.set_fact:
        current_connection: "{{ active_connection.stdout | trim }}"

    # ================================================================
    # VERIFY DHCP AND AUTOMATIC DNS
    # ================================================================

    - name: Get current IPv4 method
      ansible.builtin.command:
        cmd: nmcli -g ipv4.method connection show "{{ current_connection }}"
      register: current_ipv4_method
      changed_when: false

    - name: Verify IPv4 uses DHCP
      ansible.builtin.assert:
        that:
          - current_ipv4_method.stdout | trim == "auto"
        fail_msg: >-
          IPv4 on connection '{{ current_connection }}' is not configured
          for DHCP.

          Current IPv4 method:
          {{ current_ipv4_method.stdout | trim }}

          This playbook only supports IPv4 DHCP configuration.
          No changes have been made.

    - name: Get current IPv4 DNS mode
      ansible.builtin.command:
        cmd: nmcli -g ipv4.ignore-auto-dns connection show "{{ current_connection }}"
      register: current_ipv4_ignore_auto_dns
      changed_when: false

    - name: Verify IPv4 DNS is automatic
      ansible.builtin.assert:
        that:
          - current_ipv4_ignore_auto_dns.stdout | trim == "no"
        fail_msg: >-
          IPv4 DNS on connection '{{ current_connection }}' is not
          configured for automatic DNS obtained from DHCP.

          ipv4.ignore-auto-dns:
          {{ current_ipv4_ignore_auto_dns.stdout | trim }}

          This playbook requires automatic DNS configuration.
          No changes have been made.

    # ================================================================
    # DISPLAY PLAN
    # ================================================================

    - name: Get current active IPv4 configuration
      ansible.builtin.command:
        cmd: >-
          nmcli -g IP4.ADDRESS,IP4.GATEWAY,IP4.DNS
          device show {{ bridge_interface }}
      register: current_active_ipv4
      changed_when: false

    - name: Display planned network migration
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "KVM BRIDGE CONFIGURATION"
          - "======================================================"
          - ""
          - "Operating system:"
          - "  {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - ""
          - "Physical interface:"
          - "  {{ bridge_interface }}"
          - ""
          - "Physical interface MAC:"
          - "  {{ bridge_mac_address }}"
          - ""
          - "Current NetworkManager profile:"
          - "  {{ current_connection }}"
          - ""
          - "IPv4 configuration:"
          - "  DHCP"
          - ""
          - "IPv4 DNS:"
          - "  Automatic (DHCP)"
          - ""
          - "Current active IPv4 configuration:"
          - "{{ current_active_ipv4.stdout_lines | map('regex_replace', '^', '  ') | list }}"
          - ""
          - "Planned configuration:"
          - "  {{ bridge_name }}"
          - "    ├── MAC: {{ bridge_mac_address }}"
          - "    ├── IPv4: DHCP"
          - "    ├── IPv6: auto"
          - "    └── {{ bridge_interface }}"
          - ""
          - "The host's DHCP and DNS configuration will move"
          - "from {{ bridge_interface }} to {{ bridge_name }}."

    # ================================================================
    # USER CONFIRMATION
    # ================================================================

    - name: Confirm network migration
      ansible.builtin.pause:
        prompt: |
          The network configuration above will be changed.

          Continue with creation of {{ bridge_name }}?
          Type 'yes' to continue or anything else to cancel
      register: bridge_confirmation

    - name: Stop if network migration was not confirmed
      ansible.builtin.fail:
        msg: "Network bridge creation cancelled by user."
      when:
        - bridge_confirmation.user_input | lower != "yes"

    # ================================================================
    # CREATE MIGRATION BASH SCRIPT
    # ================================================================

    - name: Create bridge migration script on targeted machine
      ansible.builtin.template:
        src: "create-bridge-interface.sh.j2"
        dest: "{{ bridge_script }}"
        owner: root
        group: root
        mode: "0750"


    # ================================================================
    # START MIGRATION SCRIPT INDEPENDENTLY OF SSH
    # ================================================================

    - name: Start bridge migration on remote machine using systemd
      ansible.builtin.command:
        cmd: >-
          systemd-run
          --unit={{ bridge_unit }}
          --collect
          --property=Type=oneshot
          {{ bridge_script }}
      register: bridge_systemd_start
      changed_when: true

    - name: Display migration start information
      ansible.builtin.debug:
        msg:
          - "Bridge migration has been started independently of SSH."
          - "Systemd unit: {{ bridge_unit }}"
          - "Log file: /var/log/ansible-create-bridge.log"
          - ""
          - "The SSH connection may now be interrupted while NetworkManager"
          - "moves the IP configuration from {{ bridge_interface }}"
          - "to {{ bridge_name }}."

    # ================================================================
    # WAIT FOR HOST TO BECOME AVAILABLE AGAIN
    # ================================================================

    - name: Wait for SSH connection to return
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120
        sleep: 5
      delegate_to: "{{ inventory_hostname }}"

    # ================================================================
    # WAIT FOR MIGRATION UNIT TO FINISH
    # ================================================================

    - name: Wait for bridge migration systemd unit to finish
      ansible.builtin.command:
        cmd: systemctl is-active "{{ bridge_unit }}"
      register: bridge_migration_state
      until:
        - bridge_migration_state.stdout | trim in ['inactive', 'failed']
      retries: 30
      delay: 2
      failed_when: false
      changed_when: false

    - name: Get bridge migration systemd unit result
      ansible.builtin.command:
        cmd: systemctl show "{{ bridge_unit }}" --property=Result --value
      register: bridge_migration_result
      changed_when: false
      failed_when: false

    - name: Stop if bridge migration failed
      ansible.builtin.fail:
        msg: >-
          Bridge migration failed.

          Systemd result:
          {{ bridge_migration_result.stdout | trim }}

          Check:
          systemctl status {{ bridge_unit }}

          and:
          /var/log/ansible-create-bridge.log
      when:
        - bridge_migration_result.stdout | trim != "success"

    # ================================================================
    # VERIFY RESULT
    # ================================================================

    - name: Check bridge device
      ansible.builtin.command:
        cmd: nmcli -t -f DEVICE,TYPE,STATE device status
      register: final_devices
      changed_when: false

    - name: Show final network devices
      ansible.builtin.debug:
        var: final_devices.stdout_lines

    - name: Check bridge connection
      ansible.builtin.command:
        cmd: nmcli -g GENERAL.STATE connection show "{{ bridge_name }}"
      register: final_bridge_state
      changed_when: false

    - name: Get bridge IP addresses
      ansible.builtin.command:
        cmd: ip -4 -o addr show dev "{{ bridge_name }}"
      register: final_bridge_ip
      changed_when: false

    - name: Get physical interface IP addresses
      ansible.builtin.command:
        cmd: ip -4 -o addr show dev "{{ bridge_interface }}"
      register: final_interface_ip
      changed_when: false

    - name: Get default route
      ansible.builtin.command:
        cmd: ip -4 route show default
      register: final_default_route
      changed_when: false

    - name: Show final bridge configuration
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "FINAL KVM BRIDGE CONFIGURATION"
          - "======================================================"
          - ""
          - "Bridge:"
          - "  {{ bridge_name }}"
          - ""
          - "Bridge state:"
          - "  {{ final_bridge_state.stdout | trim }}"
          - ""
          - "Bridge IPv4:"
          - "  {{ final_bridge_ip.stdout | trim }}"
          - ""
          - "Physical interface:"
          - "  {{ bridge_interface }}"
          - ""
          - "Physical interface IPv4:"
          - "  {{ final_interface_ip.stdout | trim | default('(none)', true) }}"
          - ""
          - "Default route:"
          - "  {{ final_default_route.stdout | trim }}"
          - ""
          - "======================================================"

    - name: Verify bridge has IPv4 address
      ansible.builtin.assert:
        that:
          - final_bridge_ip.stdout | trim | length > 0
        fail_msg: >-
          Bridge {{ bridge_name }} does not have an IPv4 address.
          Check /var/log/ansible-create-bridge.log.
        success_msg: >-
          Bridge {{ bridge_name }} has an IPv4 address.

    - name: Verify physical interface has no IPv4 address
      ansible.builtin.assert:
        that:
          - final_interface_ip.stdout | trim | length == 0
        fail_msg: >-
          Physical interface {{ bridge_interface }} still has an IPv4 address.
          Expected topology is IP -> {{ bridge_name }} -> {{ bridge_interface }}.
        success_msg: >-
          Physical interface {{ bridge_interface }} has no IPv4 address.

    - name: Verify default route exists
      ansible.builtin.assert:
        that:
          - final_default_route.stdout | trim | length > 0
        fail_msg: >-
          No IPv4 default route was found after bridge migration.
        success_msg: >-
          IPv4 default route is present.


